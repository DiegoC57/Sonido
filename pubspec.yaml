name: sonido
description: "A multiplatform music player app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  go_router: ^17.3.0
  just_audio: ^0.10.5
  on_audio_query:
    git:
      url: https://github.com/rozpo/on_audio_query
      ref: 0d78299
      path: packages/on_audio_query
  path_provider: ^2.1.0
  audio_service: ^0.18.0
  rxdart: ^0.27.0
  palette_generator: ^0.3.3+7
  share_plus: ^13.3.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
